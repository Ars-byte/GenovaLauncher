# GenovaLauncher — Unified Build & Release
#
# On push to main: builds + uploads artifacts (no release)
# On tag v* push:  builds + creates GitHub Release with all packages

name: Build & Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.3.2)"
        required: true
        default: "v1.3.2"
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'themes/**'
      - 'icon.png'
      - 'GenovaLauncher.spec'
      - 'build.sh'
      - 'requirements.txt'
      - '.github/workflows/build-packages.yml'
  push_tags:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv patchelf binutils

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          source venv/bin/activate
          ./build.sh

      - name: Download appimagetool
        run: |
          curl -sL "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          /tmp/appimagetool --appimage-extract
          mv squashfs-root /tmp/appimagetool-extracted

      - name: Read version from constants
        id: ver
        run: |
          VERSION=$(grep -E '^VERSION_LAUNCHER' src/constants.py | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      # ═══════════════════════════════════════════
      #  Packages
      # ═══════════════════════════════════════════

      - name: Package .tar.gz
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          DIR="GenovaLauncher-${VERSION}"
          mv dist/GenovaLauncherMCPE "$DIR"
          tar -czf "packages/${DIR}.tar.gz" "$DIR"
          mv "$DIR" dist/GenovaLauncherMCPE
          ls -lh "packages/${DIR}.tar.gz"

      - name: Package .deb
        run: |
          set -e
          VERSION="${{ steps.ver.outputs.version }}"
          DIST="dist/GenovaLauncherMCPE"
          OUT="packages"
          mkdir -p "$OUT"
          DEB_BASE="$OUT/pkg-deb"
          rm -rf "$DEB_BASE"
          mkdir -p "$DEB_BASE/usr/bin"
          mkdir -p "$DEB_BASE/usr/share/genovalauncher"
          mkdir -p "$DEB_BASE/usr/share/applications"
          mkdir -p "$DEB_BASE/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "$DEB_BASE/DEBIAN"

          cat > "$DEB_BASE/usr/bin/genovalauncher" << 'HEREDOC'
          #!/bin/bash
          exec /usr/share/genovalauncher/GenovaLauncherMCPE "$@"
          HEREDOC
          chmod 755 "$DEB_BASE/usr/bin/genovalauncher"

          cp -a "$DIST"/* "$DEB_BASE/usr/share/genovalauncher/"

          cat > "$DEB_BASE/usr/share/applications/genovalauncher.desktop" << HEREDOC
          [Desktop Entry]
          Name=GenovaLauncher
          Comment=Minecraft Bedrock Launcher for Linux
          Exec=genovalauncher
          Icon=genovalauncher
          Terminal=false
          Type=Application
          Categories=Game;
          HEREDOC

          cp icon.png "$DEB_BASE/usr/share/icons/hicolor/256x256/apps/genovalauncher.png"

          cat > "$DEB_BASE/DEBIAN/control" << HEREDOC
          Package: genovalauncher
          Version: ${VERSION}
          Section: games
          Priority: optional
          Architecture: amd64
          Maintainer: Ars-Byte <arsbyte@github>
          Description: Unofficial Minecraft Bedrock Launcher for Linux
           GenovaLauncher is an unofficial launcher for Minecraft Bedrock
           Edition on Linux, powered by the mcpelauncher project.
          Homepage: https://github.com/Ars-byte/GenovaLauncher
          HEREDOC

          cat > "$DEB_BASE/DEBIAN/postinst" << 'HEREDOC'
          #!/bin/sh
          set -e
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
              gtk-update-icon-cache -q /usr/share/icons/hicolor 2>/dev/null || true
          fi
          HEREDOC
          chmod 755 "$DEB_BASE/DEBIAN/postinst"

          echo "2.0" > "$OUT/debian-binary"
          tar -czf "$OUT/control.tar.gz" --owner=0 --group=0 -C "$DEB_BASE" DEBIAN
          tar -czf "$OUT/data.tar.gz" --owner=0 --group=0 -C "$DEB_BASE" usr
          ar -rcs "$OUT/genovalauncher_${VERSION}_amd64.deb" "$OUT/debian-binary" "$OUT/control.tar.gz" "$OUT/data.tar.gz"
          rm -f "$OUT/debian-binary" "$OUT/control.tar.gz" "$OUT/data.tar.gz"
          ls -lh "$OUT/genovalauncher_${VERSION}_amd64.deb"

      - name: Package .xbps
        run: |
          set -e
          VERSION="${{ steps.ver.outputs.version }}"
          DIST="dist/GenovaLauncherMCPE"
          OUT="packages"
          mkdir -p "$OUT"
          XBPS_BASE="$OUT/xbps-pkg"
          rm -rf "$XBPS_BASE"
          mkdir -p "$XBPS_BASE/usr/bin"
          mkdir -p "$XBPS_BASE/usr/share/genovalauncher"
          mkdir -p "$XBPS_BASE/usr/share/applications"
          mkdir -p "$XBPS_BASE/usr/share/icons/hicolor/256x256/apps"

          cat > "$XBPS_BASE/usr/bin/genovalauncher" << 'HEREDOC'
          #!/bin/bash
          exec /usr/share/genovalauncher/GenovaLauncherMCPE "$@"
          HEREDOC
          chmod 755 "$XBPS_BASE/usr/bin/genovalauncher"

          cp -a "$DIST"/* "$XBPS_BASE/usr/share/genovalauncher/"

          cat > "$XBPS_BASE/usr/share/applications/genovalauncher.desktop" << HEREDOC
          [Desktop Entry]
          Name=GenovaLauncher
          Comment=Minecraft Bedrock Launcher for Linux
          Exec=genovalauncher
          Icon=genovalauncher
          Terminal=false
          Type=Application
          Categories=Game;
          HEREDOC
          cp icon.png "$XBPS_BASE/usr/share/icons/hicolor/256x256/apps/genovalauncher.png"

          tar -czf "$OUT/genovalauncher-${VERSION}_1.x86_64.xbps" --owner=0 --group=0 -C "$XBPS_BASE" usr
          ls -lh "$OUT/genovalauncher-${VERSION}_1.x86_64.xbps"

      - name: Package .AppImage
        run: |
          set -e
          VERSION="${{ steps.ver.outputs.version }}"
          DIST="dist/GenovaLauncherMCPE"
          OUT="packages"
          mkdir -p "$OUT"
          APPDIR="$OUT/AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/share"

          cat > "$APPDIR/AppRun" << 'HEREDOC'
          #!/bin/bash
          APPDIR="$(dirname "$(readlink -f "$0")")"
          exec "${APPDIR}/share/GenovaLauncherMCPE" "$@"
          HEREDOC
          chmod 755 "$APPDIR/AppRun"

          cp -a "$DIST" "$APPDIR/share/GenovaLauncherMCPE"

          cat > "$APPDIR/genovalauncher.desktop" << HEREDOC
          [Desktop Entry]
          Name=GenovaLauncher
          Comment=Minecraft Bedrock Launcher for Linux
          Exec=genovalauncher
          Icon=genovalauncher
          Terminal=false
          Type=Application
          Categories=Game;
          StartupWMClass=GenovaLauncherMCPE
          HEREDOC

          cp icon.png "$APPDIR/genovalauncher.png"
          /tmp/appimagetool-extracted/AppRun --comp gzip "$APPDIR" "$OUT/GenovaLauncher-${VERSION}-x86_64.AppImage"
          chmod +x "$OUT/GenovaLauncher-${VERSION}-x86_64.AppImage"
          ls -lh "$OUT/GenovaLauncher-${VERSION}-x86_64.AppImage"

      # ═══════════════════════════════════════════
      #  Upload: artifacts on push, release on tag
      # ═══════════════════════════════════════════

      - name: Upload artifacts (all)
        uses: actions/upload-artifact@v4
        with:
          name: genova-launcher-packages
          path: packages/*
          if-no-files-found: error
          retention-days: 30

      - name: Create Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GenovaLauncher ${{ github.ref_name }}
          fail_on_unmatched_files: false
          overwrite: true
          files: |
            packages/GenovaLauncher-*.tar.gz
            packages/genovalauncher_*.deb
            packages/genovalauncher-*.xbps
            packages/GenovaLauncher-*.AppImage
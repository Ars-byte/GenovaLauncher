# Release workflow for SunshineLauncher
#
# When a tag v* is pushed (or triggered manually), this workflow:
#   1. Builds the Python app with PyInstaller
#   2. Packages the portable .tar.gz
#   3. Creates a GitHub Release
#
# How to trigger:
#   git tag v3.1.0
#   git push origin v3.1.0

name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v3.1.0)"
        required: true
        default: "v3.1.0"

  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-venv patchelf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install PySide6 Pillow pyinstaller

      - name: Build with PyInstaller
        run: |
          source venv/bin/activate
          ./build.sh

      - name: Package portable build
        run: |
          if [ -d "dist/SunshineLauncherMCPE" ]; then
            DIR="SunshineLauncher-${{ env.VERSION }}"
            mv dist/SunshineLauncherMCPE "$DIR"
            cp assets/SunshineLauncher.sh "$DIR/SunshineLauncher.sh" 2>/dev/null || true
            tar -czf "$DIR.tar.gz" "$DIR"
            rm -rf "$DIR"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: SunshineLauncher ${{ env.VERSION }}
          fail_on_unmatched_files: false
          overwrite: true
          files: |
            SunshineLauncher-${{ env.VERSION }}.tar.gz
